<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:40vw; height:40vw; background:#2C8C8C; top:-16vw; right:-10vw; }
  #b2 { width:30vw; height:30vw; background:#E2725B; bottom:-14vw; left:-8vw; }
  #stage { position:relative; width:100%; height:100%; padding:6vh 7vw; }
  #title { font-size:4vw; font-weight:800; text-align:center; opacity:0;
           margin-bottom:5vh; }
  #cols { display:flex; gap:4vw; }
  .card { flex:1; background:#fff; border-radius:2vw; padding:4vh 2.6vw;
          box-shadow:0 1.2vh 4vh rgba(31,58,77,.10); opacity:0; }
  .card h2 { font-size:2.7vw; font-weight:800; margin-bottom:3.2vh;
             display:flex; align-items:center; gap:1.2vw; }
  #left h2  { color:#2C8C8C; }
  #right h2 { color:#E2725B; }
  .card .row { display:flex; gap:1.4vw; align-items:flex-start;
               font-size:2.1vw; font-weight:600; margin-bottom:2.6vh; opacity:0; }
  .mark { font-weight:800; flex:0 0 auto; }
  #left  .mark { color:#2C8C8C; }
  #right .mark { color:#E2725B; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div class="blob" id="b2"></div>
<div id="stage">
  <div id="title"></div>
  <div id="cols">
    <div class="card" id="left"><h2></h2><div class="rows"></div></div>
    <div class="card" id="right"><h2></h2><div class="rows"></div></div>
  </div>
</div>
<script>
let D = 10, leftRows = [], rightRows = [];

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog  = (t, s, len) => clamp((t - s) / len, 0, 1);
const easeOut = p => 1 - Math.pow(1 - p, 3);

function fill(id, data, mark) {
  const card = document.getElementById(id);
  card.querySelector("h2").textContent = (data && data.title) || "";
  const wrap = card.querySelector(".rows");
  wrap.innerHTML = "";
  return ((data && data.items) || []).slice(0, 4).map(text => {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<span class="mark">${mark}</span><span></span>`;
    el.querySelector("span:last-child").textContent = text;
    wrap.appendChild(el);
    return el;
  });
}

function setup(params, duration) {
  D = duration;
  document.getElementById("title").textContent = params.title || "";
  leftRows = fill("left", params.left, "✓");
  rightRows = fill("right", params.right, "✕");
  seek(0);
}

function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t * .5) * 1.2}vw, ${Math.cos(t * .4) * 1.1}vh)`;
  document.getElementById("b2").style.transform =
    `translate(${Math.cos(t * .46) * 1.3}vw, ${Math.sin(t * .5) * 1.2}vh)`;

  const tp = easeOut(prog(t, 0.25, 0.6));
  const title = document.getElementById("title");
  title.style.opacity = tp;
  title.style.transform = `translateY(${(1 - tp) * 2.5}vh)`;

  const lp = easeOut(prog(t, 0.9, 0.7));
  const left = document.getElementById("left");
  left.style.opacity = lp;
  left.style.transform = `translateX(${(1 - lp) * -4}vw)`;

  const rp = easeOut(prog(t, 1.15, 0.7));
  const right = document.getElementById("right");
  right.style.opacity = rp;
  right.style.transform = `translateX(${(1 - rp) * 4}vw)`;

  const n = Math.max(leftRows.length, rightRows.length, 1);
  const gap = clamp((D - 3.4) / n, 0.35, 1.0);
  leftRows.forEach((el, i) => { el.style.opacity = easeOut(prog(t, 1.8 + i * gap, 0.5)); });
  rightRows.forEach((el, i) => { el.style.opacity = easeOut(prog(t, 2.0 + i * gap, 0.5)); });
}
</script>
</body>
</html>
