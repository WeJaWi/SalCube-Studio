<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Dust motes + soft twinkles, white on black — screen-blended over footage.
// Deterministic: everything derives from seeded pseudo-random + seek(t).
let D = 16, parts = [];

function rng(seed) {  // mulberry32
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let z = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}

function setup(params, duration) {
  D = duration;
  const c = document.getElementById("c");
  c.width = window.innerWidth; c.height = window.innerHeight;
  const r = rng(20260706);
  const N_DUST = 90, N_TWINKLE = 26;
  parts = [];
  for (let i = 0; i < N_DUST; i++) {
    parts.push({kind: "dust", x: r(), y: r(), size: .8 + r() * 2.6,
                speed: 6 + r() * 16, drift: (r() - .5) * 14,
                phase: r() * Math.PI * 2, alpha: .12 + r() * .3});
  }
  for (let i = 0; i < N_TWINKLE; i++) {
    parts.push({kind: "twinkle", x: r(), y: r() * .85, size: 1.6 + r() * 2.6,
                period: 1.6 + r() * 3.4, phase: r() * Math.PI * 2,
                alpha: .5 + r() * .5});
  }
  seek(0);
}

function seek(t) {
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  const W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  for (const p of parts) {
    if (p.kind === "dust") {
      // slow upward drift with a sine sway; wraps around vertically
      const y = ((p.y * H - t * p.speed) % (H + 40) + H + 40) % (H + 40) - 20;
      const x = p.x * W + Math.sin(t * .5 + p.phase) * p.drift;
      const a = p.alpha * (.75 + .25 * Math.sin(t * .9 + p.phase));
      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,250,240,${a.toFixed(3)})`;
      ctx.fill();
    } else {
      const tw = Math.max(0, Math.sin((t / p.period) * Math.PI * 2 + p.phase));
      const a = p.alpha * Math.pow(tw, 2.5);
      if (a < .01) continue;
      const x = p.x * W, y = p.y * H, s = p.size * (1 + tw * .8);
      const g = ctx.createRadialGradient(x, y, 0, x, y, s * 4);
      g.addColorStop(0, `rgba(255,252,245,${a.toFixed(3)})`);
      g.addColorStop(1, "rgba(255,252,245,0)");
      ctx.beginPath();
      ctx.arc(x, y, s * 4, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      // cross sparkle
      ctx.strokeStyle = `rgba(255,252,245,${(a * .9).toFixed(3)})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - s * 3, y); ctx.lineTo(x + s * 3, y);
      ctx.moveTo(x, y - s * 3); ctx.lineTo(x, y + s * 3);
      ctx.stroke();
    }
  }
}
</script>
</body>
</html>
