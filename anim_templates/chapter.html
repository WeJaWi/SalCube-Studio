<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body { background:#1F3A4D; color:#FAF6EF;
         font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  #glow { position:absolute; width:70vw; height:70vw; border-radius:50%;
          left:15vw; top:50%; transform:translateY(-50%);
          background:radial-gradient(circle,rgba(44,140,140,.28),transparent 62%); }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:0 12vw; }
  #kicker { font-size:2.1vw; font-weight:800; color:#E2A25B;
            letter-spacing:.3em; text-transform:uppercase; opacity:0; }
  #line { width:0; height:.4vh; background:#2C8C8C; margin:3.2vh 0; }
  #title { font-size:5.6vw; font-weight:800; line-height:1.15;
           font-family:Georgia,serif; opacity:0; }
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <div id="kicker"></div>
  <div id="line"></div>
  <div id="title"></div>
</div>
<script>
let D = 6;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);

function setup(params, duration) {
  D = duration;
  document.getElementById("kicker").textContent = params.kicker || "";
  document.getElementById("title").textContent = params.title || "";
  seek(0);
}
function seek(t) {
  const k = easeOut(prog(t, .25, .6));
  const kicker = document.getElementById("kicker");
  kicker.style.opacity = k;
  kicker.style.letterSpacing = `${.44 - .14 * k}em`;
  document.getElementById("line").style.width =
    `${easeOut(prog(t, .6, .7)) * 14}vw`;
  const x = easeOut(prog(t, .9, .8));
  const title = document.getElementById("title");
  title.style.opacity = x;
  title.style.transform = `translateY(${(1-x)*2.6}vh)`;
  document.getElementById("glow").style.opacity = .7 + Math.sin(t*1.2)*.25;
}
</script>
</body>
</html>
