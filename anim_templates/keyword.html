<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#1F3A4D; color:#FAF6EF; }
  #glow { position:absolute; width:60vw; height:60vw; border-radius:50%;
          left:20vw; top:50%; transform:translateY(-50%);
          background:radial-gradient(circle,rgba(44,140,140,.35),transparent 65%); }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:0 8vw; }
  #word { font-size:9vw; font-weight:800; letter-spacing:.02em; line-height:1.05;
          opacity:0; color:#FAF6EF; }
  #word .accent { color:#7fd4d4; }
  #sub { font-size:2.4vw; font-weight:600; color:#cdb9a0; margin-top:4.5vh;
         opacity:0; }
  #underline { height:1vh; background:#E2A25B; border-radius:1vh; width:24vw;
               margin-top:2.6vh; transform:scaleX(0); }
</style>
</head>
<body>
<div id="glow"></div>
<div id="stage">
  <div id="word"></div>
  <div id="underline"></div>
  <div id="sub"></div>
</div>
<script>
let D = 6;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);
const back = p=>{const c=1.7;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

function setup(params, duration) {
  D = duration;
  document.getElementById("word").textContent = params.word || "";
  document.getElementById("sub").textContent = params.sub || "";
  seek(0);
}
function seek(t) {
  const w = document.getElementById("word");
  const p = prog(t, .25, .55);
  w.style.opacity = easeOut(p);
  w.style.transform = `scale(${.7 + .3*back(p)})`;
  document.getElementById("underline").style.transform =
    `scaleX(${easeOut(prog(t, .75, .5))})`;
  const s = easeOut(prog(t, 1.05, .6));
  const sub = document.getElementById("sub");
  sub.style.opacity = s; sub.style.transform = `translateY(${(1-s)*2}vh)`;
  document.getElementById("glow").style.opacity = .7 + Math.sin(t*1.4)*.25;
}
</script>
</body>
</html>
