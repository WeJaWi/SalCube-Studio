<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:44vw; height:44vw; background:#2C8C8C; top:-18vw; right:-12vw; }
  #b2 { width:34vw; height:34vw; background:#E2A25B; bottom:-16vw; left:-10vw; }
  #stage { position:relative; width:100%; height:100%; padding:7vh 9vw; }
  #title { font-size:4.6vw; font-weight:800; letter-spacing:-.01em; opacity:0;
           margin-bottom:5.5vh; }
  #title .bar { display:block; width:8vw; height:.9vh; background:#2C8C8C;
                border-radius:1vh; margin-top:2.2vh; transform-origin:left;
                transform:scaleX(0); }
  .item { display:flex; align-items:center; gap:2.4vw; margin-bottom:4.2vh;
          opacity:0; }
  .item .text { font-size:3vw; font-weight:600; }
  .badge { width:4.6vw; height:4.6vw; flex:0 0 auto; border-radius:50%;
           background:#2C8C8C; display:flex; align-items:center;
           justify-content:center; box-shadow:0 .6vh 2vh rgba(44,140,140,.35); }
  .badge svg { width:2.6vw; height:2.6vw; }
  .badge path { stroke:#fff; stroke-width:9; fill:none; stroke-linecap:round;
                stroke-linejoin:round; stroke-dasharray:100; stroke-dashoffset:100; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div class="blob" id="b2"></div>
<div id="stage">
  <div id="title"><span id="titleText"></span><span class="bar"></span></div>
  <div id="items"></div>
</div>
<script>
let D = 10, rows = [];

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
// progress of a sub-animation starting at s, lasting len
const prog  = (t, s, len) => clamp((t - s) / len, 0, 1);
const easeOut = p => 1 - Math.pow(1 - p, 3);

function setup(params, duration) {
  D = duration;
  document.getElementById("titleText").textContent = params.title || "";
  const wrap = document.getElementById("items");
  wrap.innerHTML = "";
  rows = (params.items || []).slice(0, 6).map(text => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<span class="badge"><svg viewBox="0 0 100 100">
        <path d="M22 52 L42 72 L78 30"/></svg></span>
      <span class="text"></span>`;
    el.querySelector(".text").textContent = text;
    wrap.appendChild(el);
    return el;
  });
  seek(0);
}

function seek(t) {
  // gentle background drift
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t * .5) * 1.2}vw, ${Math.cos(t * .4) * 1.2}vh)`;
  document.getElementById("b2").style.transform =
    `translate(${Math.cos(t * .45) * 1.4}vw, ${Math.sin(t * .5) * 1.2}vh)`;

  const title = document.getElementById("title");
  const tp = easeOut(prog(t, 0.25, 0.6));
  title.style.opacity = tp;
  title.style.transform = `translateY(${(1 - tp) * 3}vh)`;
  title.querySelector(".bar").style.transform = `scaleX(${easeOut(prog(t, 0.6, 0.6))})`;

  const n = rows.length || 1;
  const gap = clamp((D - 3.0) / n, 0.45, 1.3);
  rows.forEach((el, i) => {
    const s = 1.3 + i * gap;
    const p = easeOut(prog(t, s, 0.55));
    el.style.opacity = p;
    el.style.transform = `translateX(${(1 - p) * 3}vw)`;
    el.querySelector("path").style.strokeDashoffset = 100 * (1 - prog(t, s + 0.15, 0.5));
  });
}
</script>
</body>
</html>
