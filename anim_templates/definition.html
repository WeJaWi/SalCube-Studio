<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; }
  body { background:#FAF6EF; color:#1F3A4D;
         font-family:Georgia,"Times New Roman",serif; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:38vw; height:38vw; background:#2C8C8C; bottom:-16vw; left:-10vw; }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; justify-content:center; padding:0 16vw; }
  #word { font-size:6.4vw; font-weight:700; opacity:0; }
  #pron { font-size:2.4vw; color:#7a8a94; font-style:italic; margin-top:1.2vh;
          opacity:0; }
  #rule { width:10vw; height:.5vh; background:#E2A25B; border-radius:1vh;
          margin:3.4vh 0; transform-origin:left; transform:scaleX(0); }
  #def { font-size:2.7vw; line-height:1.55; opacity:0; }
  #wc { color:#2C8C8C; font-style:italic; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div id="stage">
  <div id="word"></div>
  <div id="pron"></div>
  <div id="rule"></div>
  <div id="def"><span id="wc"></span><span id="deftext"></span></div>
</div>
<script>
let D = 8;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);

function setup(params, duration) {
  D = duration;
  document.getElementById("word").textContent = params.word || "";
  document.getElementById("pron").textContent = params.pronunciation || "";
  // word_class: optional part-of-speech label in the video's language
  document.getElementById("wc").textContent =
    params.word_class ? params.word_class + " · " : "";
  document.getElementById("deftext").textContent = params.definition || "";
  seek(0);
}
function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.cos(t*.45)*1.3}vw, ${Math.sin(t*.5)*1.2}vh)`;
  const w = easeOut(prog(t, .25, .6));
  const word = document.getElementById("word");
  word.style.opacity = w; word.style.transform = `translateY(${(1-w)*2.4}vh)`;
  document.getElementById("pron").style.opacity = easeOut(prog(t, .7, .5));
  document.getElementById("rule").style.transform =
    `scaleX(${easeOut(prog(t, .95, .6))})`;
  const d = easeOut(prog(t, 1.25, .7));
  const def = document.getElementById("def");
  def.style.opacity = d; def.style.transform = `translateY(${(1-d)*2}vh)`;
}
</script>
</body>
</html>
