<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:40vw; height:40vw; background:#2C8C8C; top:-17vw; left:-11vw; }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center; }
  #title { font-size:3.8vw; font-weight:800; margin-bottom:6vh; opacity:0;
           text-align:center; padding:0 12vw; }
  #row { display:flex; gap:5vw; }
  .cell { width:20vw; text-align:center; opacity:0; }
  .bubble { width:13vw; height:13vw; margin:0 auto; border-radius:50%;
            background:#fff; display:flex; align-items:center;
            justify-content:center; font-size:3.6vw; font-weight:800;
            color:#2C8C8C; box-shadow:0 1.2vh 4vh rgba(31,58,77,.12);
            border:.5vw solid #e7f3f1; }
  .cell:nth-child(2) .bubble { color:#E2A25B; border-color:#fdf3e2; }
  .cell:nth-child(3) .bubble { color:#E2725B; border-color:#fdeeea; }
  .lbl { font-size:1.9vw; font-weight:650; margin-top:2.6vh; line-height:1.35; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div id="stage">
  <div id="title"></div>
  <div id="row"></div>
</div>
<script>
let D = 8, cells = [];
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);
const back = p=>{const c=1.4;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);};

function setup(params, duration) {
  D = duration;
  document.getElementById("title").textContent = params.title || "";
  const row = document.getElementById("row");
  row.innerHTML = "";
  cells = (params.items || []).slice(0, 3).map(it => {
    const el = document.createElement("div");
    el.className = "cell";
    el.innerHTML = `<div class="bubble"></div><div class="lbl"></div>`;
    el.querySelector(".bubble").textContent = it.value ?? "";
    el.querySelector(".lbl").textContent = it.label || "";
    row.appendChild(el);
    return el;
  });
  seek(0);
}
function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t*.5)*1.2}vw, ${Math.cos(t*.42)*1.1}vh)`;
  const tp = easeOut(prog(t, .25, .6));
  const title = document.getElementById("title");
  title.style.opacity = tp; title.style.transform = `translateY(${(1-tp)*2.5}vh)`;
  cells.forEach((el, i) => {
    const p = prog(t, 1.0 + i * .45, .55);
    el.style.opacity = easeOut(p);
    el.style.transform = `scale(${.75 + .25 * back(p)})`;
  });
}
</script>
</body>
</html>
