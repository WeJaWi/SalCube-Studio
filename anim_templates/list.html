<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:42vw; height:42vw; background:#E2A25B; top:-18vw; left:-12vw; }
  #b2 { width:30vw; height:30vw; background:#2C8C8C; bottom:-14vw; right:-9vw; }
  #stage { position:relative; width:100%; height:100%; padding:7vh 12vw; }
  #title { font-size:4.4vw; font-weight:800; margin-bottom:5.5vh; opacity:0; }
  #title .bar { display:block; width:8vw; height:.9vh; background:#E2A25B;
                border-radius:1vh; margin-top:2vh; transform-origin:left;
                transform:scaleX(0); }
  .item { display:flex; align-items:center; gap:2.4vw; margin-bottom:4vh;
          opacity:0; }
  .num { width:5vw; height:5vw; flex:0 0 auto; border-radius:1.4vh;
         background:#1F3A4D; color:#FAF6EF; display:flex; align-items:center;
         justify-content:center; font-size:2.6vw; font-weight:800; }
  .item .text { font-size:2.9vw; font-weight:650; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div class="blob" id="b2"></div>
<div id="stage">
  <div id="title"><span id="titleText"></span><span class="bar"></span></div>
  <div id="items"></div>
</div>
<script>
let D = 10, rows = [];
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);

function setup(params, duration) {
  D = duration;
  document.getElementById("titleText").textContent = params.title || "";
  const wrap = document.getElementById("items");
  wrap.innerHTML = "";
  rows = (params.items || []).slice(0, 5).map((text, i) => {
    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `<span class="num">${i + 1}</span><span class="text"></span>`;
    el.querySelector(".text").textContent = text;
    wrap.appendChild(el);
    return el;
  });
  seek(0);
}
function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t*.5)*1.2}vw, ${Math.cos(t*.42)*1.2}vh)`;
  document.getElementById("b2").style.transform =
    `translate(${Math.cos(t*.47)*1.3}vw, ${Math.sin(t*.5)*1.1}vh)`;
  const title = document.getElementById("title");
  const tp = easeOut(prog(t, .25, .6));
  title.style.opacity = tp;
  title.style.transform = `translateY(${(1-tp)*3}vh)`;
  title.querySelector(".bar").style.transform = `scaleX(${easeOut(prog(t, .6, .6))})`;
  const n = rows.length || 1;
  const gap = clamp((D - 3.0) / n, .45, 1.3);
  rows.forEach((el, i) => {
    const p = easeOut(prog(t, 1.3 + i * gap, .55));
    el.style.opacity = p;
    el.style.transform = `translateX(${(1-p)*3}vw)`;
  });
}
</script>
</body>
</html>
