<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:44vw; height:44vw; background:#2C8C8C; bottom:-20vw; right:-13vw; }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center; }
  #wrap { position:relative; width:36vw; height:36vw; }
  svg { width:100%; height:100%; transform:rotate(-90deg); }
  /* stroke-width is in viewBox units (0-100), NOT viewport units */
  circle { fill:none; stroke-width:9; stroke-linecap:round; }
  #track { stroke:#eee4d4; }
  #arc { stroke:#2C8C8C; }
  #pct { position:absolute; inset:0; display:flex; align-items:center;
         justify-content:center; font-size:8vw; font-weight:800;
         color:#2C8C8C; }
  #label { font-size:2.8vw; font-weight:650; margin-top:4.5vh; opacity:0;
           text-align:center; padding:0 14vw; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div id="stage">
  <div id="wrap">
    <svg viewBox="0 0 100 100">
      <circle id="track" cx="50" cy="50" r="41"/>
      <circle id="arc" cx="50" cy="50" r="41"/>
    </svg>
    <div id="pct">0%</div>
  </div>
  <div id="label"></div>
</div>
<script>
let D = 8, P = 50;
const CIRC = 2 * Math.PI * 41;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);

function setup(params, duration) {
  D = duration;
  P = clamp(Number(params.percent) || 0, 0, 100);
  document.getElementById("label").textContent = params.label || "";
  const arc = document.getElementById("arc");
  arc.style.strokeDasharray = CIRC;
  document.getElementById("track").style.strokeDasharray = CIRC;
  seek(0);
}
function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.cos(t*.45)*1.3}vw, ${Math.sin(t*.5)*1.2}vh)`;
  const fillLen = clamp(D * .35, 1.0, 2.4);
  const p = easeOut(prog(t, .4, fillLen));
  document.getElementById("arc").style.strokeDashoffset =
    CIRC * (1 - (P / 100) * p);
  document.getElementById("pct").textContent = `${Math.round(P * p)}%`;
  const l = easeOut(prog(t, .4 + fillLen * .7, .7));
  const label = document.getElementById("label");
  label.style.opacity = l; label.style.transform = `translateY(${(1-l)*2}vh)`;
}
</script>
</body>
</html>
