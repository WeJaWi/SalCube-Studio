<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:Georgia,"Times New Roman",serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:44vw; height:44vw; background:#2C8C8C; top:-18vw; right:-12vw; }
  #b2 { width:30vw; height:30vw; background:#E2A25B; bottom:-14vw; left:-9vw; }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:0 16vw; }
  #mark { font-size:11vw; line-height:.6; color:#2C8C8C; opacity:0;
          font-family:Georgia,serif; }
  #text { font-size:3.4vw; font-style:italic; line-height:1.5; margin-top:2vh;
          opacity:0; }
  #attr { font-family:-apple-system,"Avenir Next",sans-serif; font-size:1.9vw;
          font-weight:700; color:#2C8C8C; letter-spacing:.14em;
          text-transform:uppercase; margin-top:5vh; opacity:0; }
  #rule { width:6vw; height:.5vh; background:#E2A25B; border-radius:1vh;
          margin-top:2.2vh; transform:scaleX(0); }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div class="blob" id="b2"></div>
<div id="stage">
  <div id="mark">“</div>
  <div id="text"></div>
  <div id="attr"></div>
  <div id="rule"></div>
</div>
<script>
let D = 8;
const clamp = (x,a,b)=>Math.min(b,Math.max(a,x));
const prog = (t,s,l)=>clamp((t-s)/l,0,1);
const easeOut = p=>1-Math.pow(1-p,3);

function setup(params, duration) {
  D = duration;
  document.getElementById("text").textContent = params.text || "";
  document.getElementById("attr").textContent = params.attribution || "";
  seek(0);
}
function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t*.5)*1.2}vw, ${Math.cos(t*.4)*1.1}vh)`;
  document.getElementById("b2").style.transform =
    `translate(${Math.cos(t*.45)*1.3}vw, ${Math.sin(t*.5)*1.2}vh)`;
  const m = easeOut(prog(t, .2, .6));
  const mark = document.getElementById("mark");
  mark.style.opacity = m; mark.style.transform = `scale(${.6+.4*m})`;
  const x = easeOut(prog(t, .55, .9));
  const text = document.getElementById("text");
  text.style.opacity = x; text.style.transform = `translateY(${(1-x)*2.5}vh)`;
  const a = easeOut(prog(t, 1.6, .7));
  document.getElementById("attr").style.opacity = a;
  document.getElementById("rule").style.transform =
    `scaleX(${easeOut(prog(t, 1.8, .7))})`;
}
</script>
</body>
</html>
