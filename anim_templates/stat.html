<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden;
    font-family:-apple-system,"Avenir Next","Segoe UI",Roboto,sans-serif; }
  body { background:#FAF6EF; color:#1F3A4D; }
  .blob { position:absolute; border-radius:50%; opacity:.10; }
  #b1 { width:46vw; height:46vw; background:#2C8C8C; top:-20vw; left:-14vw; }
  #b2 { width:30vw; height:30vw; background:#E2725B; bottom:-14vw; right:-8vw; }
  #stage { position:relative; width:100%; height:100%; display:flex;
           flex-direction:column; align-items:center; justify-content:center;
           text-align:center; padding:0 12vw; }
  #ring { position:absolute; width:34vw; height:34vw; border-radius:50%;
          border:1.1vw solid rgba(44,140,140,.18); }
  #num { font-size:13vw; font-weight:800; letter-spacing:-.03em; color:#2C8C8C;
         line-height:1; position:relative; }
  #label { font-size:3.2vw; font-weight:650; margin-top:4.5vh; opacity:0;
           position:relative; }
  /* keep clear of the burned caption zone at the very bottom */
  #note { position:absolute; bottom:16vh; width:100%; left:0; text-align:center;
          font-size:1.7vw; color:#7a8a94; opacity:0; }
</style>
</head>
<body>
<div class="blob" id="b1"></div>
<div class="blob" id="b2"></div>
<div id="stage">
  <div id="ring"></div>
  <div id="num">0</div>
  <div id="label"></div>
</div>
<div id="note"></div>
<script>
let D = 10, N = 0, SUF = "";

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const prog  = (t, s, len) => clamp((t - s) / len, 0, 1);
const easeOut = p => 1 - Math.pow(1 - p, 3);

function setup(params, duration) {
  D = duration;
  N = Number(params.number) || 0;
  SUF = params.suffix || "";
  document.getElementById("label").textContent = params.label || "";
  document.getElementById("note").textContent = params.note || "";
  seek(0);
}

function fmt(x) {
  const decimals = Number.isInteger(N) ? 0 : 1;
  return x.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function seek(t) {
  document.getElementById("b1").style.transform =
    `translate(${Math.sin(t * .5) * 1.3}vw, ${Math.cos(t * .42) * 1.2}vh)`;
  document.getElementById("b2").style.transform =
    `translate(${Math.cos(t * .48) * 1.4}vw, ${Math.sin(t * .52) * 1.3}vh)`;

  const countLen = clamp(D * 0.35, 1.0, 2.6);
  const p = easeOut(prog(t, 0.4, countLen));
  document.getElementById("num").textContent = fmt(N * p) + SUF;

  const ring = document.getElementById("ring");
  const rp = easeOut(prog(t, 0.2, countLen));
  ring.style.transform = `scale(${0.72 + rp * 0.28 + Math.sin(t * 1.1) * 0.008})`;
  ring.style.opacity = rp;

  const lp = easeOut(prog(t, 0.4 + countLen * 0.7, 0.7));
  const label = document.getElementById("label");
  label.style.opacity = lp;
  label.style.transform = `translateY(${(1 - lp) * 2.5}vh)`;

  document.getElementById("note").style.opacity = easeOut(prog(t, 0.4 + countLen, 0.8)) * 0.9;
}
</script>
</body>
</html>
